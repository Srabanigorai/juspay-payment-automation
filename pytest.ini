[pytest]
addopts = --video=on --screenshot=only-on-failure --tracing=retain-on-failure --output=reports/artifacts --html=reports/report.html --self-contained-html -ra
testpaths = tests
markers =
    mock: runs against the bundled local checkout (no internet needed)
    live: runs against a real site defined in config/targets.yaml
    mobile: runs on an Android device/emulator through Appium
